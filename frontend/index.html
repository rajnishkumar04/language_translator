<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuralTranslate | AI-Powered Linguistic Engine</title>
    <meta name="description" content="Next-generation language processing for Hindi, English, and German. Experience the future of translation.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Icons & Favicon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="neural-theme">
    <div class="grid-background"></div>
    <div class="scanline"></div>

    <header>
        <div class="container header-content">
            <div class="brand">
                <div class="neural-icon">
                    <div class="dot"></div>
                    <div class="pulse"></div>
                </div>
                <h1>NEURAL<span>TRANSLATE</span></h1>
            </div>
            <div class="system-status">
                <span class="status-indicator"></span>
                <span class="status-text">CORE ACTIVE</span>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="translator-interface">
            <!-- Language Controls -->
            <div class="interface-header">
                <div class="lang-pill active" id="source-pill">
                    <select id="source-lang">
                        <option value="en-GB">ENGLISH.sys</option>
                        <option value="hi-IN">HINDI.sys</option>
                        <option value="de-DE">GERMAN.sys</option>
                    </select>
                </div>

                <button id="swap-langs" class="neural-swap" title="Reverse Neural Flow">
                    <i class="fas fa-random"></i>
                </button>

                <div class="lang-pill active" id="target-pill">
                    <select id="target-lang">
                        <option value="de-DE">GERMAN.sys</option>
                        <option value="en-GB">ENGLISH.sys</option>
                        <option value="hi-IN">HINDI.sys</option>
                    </select>
                </div>
            </div>

            <!-- Main Processing Area -->
            <div class="processing-unit">
                <div class="unit input-unit">
                    <div class="unit-label">INPUT_DATA</div>
                    <textarea id="source-text" placeholder="// Await input..."></textarea>
                    <div class="unit-footer">
                        <div class="metadata">CHARS: <span id="char-count">0</span></div>
                        <div class="unit-actions">
                            <button class="action-btn" id="voice-input" title="Voice Input"><i class="fas fa-microphone"></i></button>
                            <button class="action-btn" id="speak-source" title="Audio Stream"><i class="fas fa-waveform"></i></button>
                            <button class="action-btn" id="copy-source" title="Buffer Copy"><i class="fas fa-microchip"></i></button>
                            <button class="action-btn" id="clear-text" title="Purge Data"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                </div>

                <div class="neural-divider">
                    <div class="line"></div>
                    <div class="core-node"></div>
                    <div class="line"></div>
                </div>

                <div class="unit output-unit">
                    <div class="unit-label">PROCESSED_OUTPUT</div>
                    <div id="target-text" class="output-display">
                        <span class="cursor-blink">_</span>
                    </div>
                    <div class="unit-footer">
                        <div class="metadata" id="translation-status">IDLE</div>
                        <div class="unit-actions">
                            <button class="action-btn" id="speak-target" title="Audio Stream"><i class="fas fa-waveform"></i></button>
                            <button class="action-btn" id="auto-speak" title="Toggle Auto-Speak"><i class="fas fa-volume-up"></i></button>
                            <button class="action-btn" id="copy-target" title="Buffer Copy"><i class="fas fa-microchip"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer Action -->
            <div class="interface-footer">
                <button id="translate-btn" class="neural-trigger">
                    <span class="btn-glitch" data-text="INITIALIZE TRANSLATION">INITIALIZE TRANSLATION</span>
                    <i class="fas fa-bolt"></i>
                </button>
            </div>
        </div>

        <!-- History Terminal -->
        <section class="terminal-history">
            <div class="terminal-header">
                <i class="fas fa-terminal"></i>
                <span>HISTORY_LOGS</span>
            </div>
            <div id="history-list" class="terminal-body">
                <!-- Log entries will appear here -->
            </div>
        </section>
    </main>

    <footer class="system-footer">
        <div class="container footer-content">
            <p>DESIGNED BY ANTIGRAVITY // VERSION 2.0.4-BETA</p>
            <div class="footer-links">
                <a href="#">ENCRYPTED_API</a>
                <a href="#">NEURAL_DOCS</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
